	<style>
		.menu-box {
			background: linear-gradient(135deg, #17865D 0%, #1a9b6b 100%);
			border-radius: 15px;
			padding: 20px;
			margin: 15px;
			box-shadow: 0 8px 25px rgba(23, 134, 93, 0.3);
		}
		
		.menu-label {
			color: white;
			font-weight: 500;
			font-size: 1.1rem;
			margin: 0;
			padding: 12px 15px;
			border-radius: 10px;
			transition: all 0.3s ease;
			cursor: pointer;
			display: block;
			text-decoration: none;
		}
		
		.menu-label:hover {
			background-color: rgba(255, 255, 255, 0.2);
			transform: translateX(5px);
			color: white;
			text-decoration: none;
		}
		
		.nav-link {
			padding: 0;
			margin: 5px 0;
			border-radius: 10px;
			transition: all 0.3s ease;
		}
		
		.nav-link:hover {
			background-color: rgba(255, 255, 255, 0.1);
		}
		
		.offcanvas {
			background: linear-gradient(180deg, #f8f9fa 0%, #e9ecef 100%);
		}
		
		.offcanvas-header {
			background: linear-gradient(135deg, #17865D 0%, #1a9b6b 100%);
			color: white;
			border-radius: 0 0 15px 15px;
		}
		
		.btn-close {
			filter: invert(1);
		}
		
		/* Animação de entrada */
		@keyframes slideIn {
			from {
				transform: translateX(-100%);
				opacity: 0;
			}
			to {
				transform: translateX(0);
				opacity: 1;
			}
		}
		
		
		
		/* Efeito de destaque para o item ativo */
		.nav-link.active .menu-label {
			background-color: rgba(255, 255, 255, 0.3);
			box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2);
		}
	</style>
</head>

<script>
    document.addEventListener("DOMContentLoaded", function() {
      let links = document.querySelectorAll(".nav-link");
      let currentPage = window.location.pathname.split("/").pop(); // pega o nome do arquivo atual
      
      links.forEach(link => {
        let href = link.getAttribute("href");
        if (href === currentPage) {
          link.classList.add("active"); // ativa só o item da página atual
        } else {
          link.classList.remove("active"); // garante que os outros fiquem limpos
        }
      });
    });
  </script>
